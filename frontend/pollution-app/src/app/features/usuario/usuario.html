<section class="usuario">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="info-card">
    <h2>Usuario</h2>
    @if (userInfoEntries().length) {
      <div class="table-wrapper">
        <table>
          <tbody>
            @for (entry of userInfoEntries(); track entry[0]) {
              <tr>
                <td>{{ entry[0] }}</td>
                <td>{{ entry[1] }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    } @else {
      <p>Cargando información del usuario…</p>
    }
  </div>
</section>
