<section class="charts">
  <h2>Gráficas</h2>

  <div class="sensor-picker">
    @for (element of deviceElements(); track element.id) {
      <label>
        <input type="checkbox"
            [checked]="selectedIds().has(element.id)"
            (change)="toggleSensor(element.id)">
        {{ element.name }}
      </label>
    }

    <div class="range-mode">
      <label>
        <input type="radio" name="rangeMode" value="hours"
            [ngModel]="mode()" (ngModelChange)="mode.set($event)">
        Últimas N horas
      </label>
      <label>
        <input type="radio" name="rangeMode" value="range"
            [ngModel]="mode()" (ngModelChange)="mode.set($event)">
        Rango de fechas
      </label>
    </div>

    @if (mode() === 'hours') {
      <input type="number" [ngModel]="hours()" (ngModelChange)="hours.set($event)" placeholder="Horas">
    }

    @if (mode() === 'range') {
      <label>
        Desde
        <input type="datetime-local" [ngModel]="rangeStart()" (ngModelChange)="rangeStart.set($event)">
      </label>
      <label>
        Hasta (opcional)
        <input type="datetime-local" [ngModel]="rangeEnd()" (ngModelChange)="rangeEnd.set($event)">
      </label>
    }

    <button (click)="generateChart()">Generar gráfica</button>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (loading()) {
    <p>Cargando...</p>
  }

  @if (lineChartData().datasets.length > 0) {
    <div class="chart-wrapper">
        <canvas baseChart
          [data]="lineChartData()"
          [options]="lineChartOptions"
          type="line">
        </canvas>
    </div>
  }
</section>
